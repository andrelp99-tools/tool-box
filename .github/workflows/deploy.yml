# BenitoTools: compila e pubblica su GitHub Pages (andrelp99-tools.github.io/tool-box/)
name: Pubblica BenitoTools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Dipendenze
        run: npm ci
        env:
          HUSKY: '0'
      - name: Controllo tipi
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run --reporter=dot
      - name: Compila
        run: npx vite build
        env:
          BASE_URL: /tool-box/
      - name: Pagina di riserva per i link diretti
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
